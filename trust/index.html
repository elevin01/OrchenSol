<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon — Orchen</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://orchen.ai/trust">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
:root {
  --green:       #2C5F3F;
  --green-dark:  #1E4329;
  --green-light: #3D7A55;
  --bg:          #F5F2EE;
  --ink:         #1A1A1A;
  --ink-muted:   #6A6460;
  --ink-faint:   #A09890;
  --wall-text:   #EDE9E4;
  --dark-bg:     #1A3527;
  --border:      #DDD8CE;
  --border-light:#EAE5DC;
  --font-display:'Playfair Display', Georgia, serif;
  --font-body:   'Lora', Georgia, serif;
  --max-w: 1200px;
  --pad: 2rem;
  --nav-h: 62px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(245,242,238,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.nav.scrolled {
  border-color: var(--border-light);
  box-shadow: 0 1px 16px rgba(26,26,26,0.06);
}
.nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--pad);
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 2rem;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.nav-logo:hover { color: var(--green); }
.nav-links { display: flex; gap: 2rem; flex: 1; }
.nav-links a { font-size: 0.875rem; color: var(--ink-muted); transition: color 0.2s; }
.nav-links a:hover { color: var(--ink); }
.btn-nav {
  display: inline-flex;
  align-items: center;
  padding: 0.5rem 1.125rem;
  background: var(--green);
  color: #fff;
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
  transition: background 0.2s;
}
.btn-nav:hover { background: var(--green-dark); }
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 4.5px;
  width: 28px;
  height: 28px;
  background: none;
  border: none;
  cursor: pointer;
  margin-left: auto;
  padding: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 1.5px;
  background: var(--ink);
  border-radius: 1px;
  transition: transform 0.25s, opacity 0.25s;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
.container { max-width: var(--max-w); margin-inline: auto; padding-inline: var(--pad); }
.stub {
  background: var(--dark-bg);
  color: var(--wall-text);
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-top: calc(var(--nav-h) + 4rem);
  padding-bottom: 4rem;
}
.stub-inner { max-width: 600px; margin-inline: auto; }
.stub-eyebrow {
  display: block;
  font-family: var(--font-body);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.7rem;
  text-transform: uppercase;
  color: rgba(237,233,228,0.5);
  margin-bottom: 1.5rem;
}
.stub h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 5vw, 3.25rem);
  line-height: 1.12;
  letter-spacing: -0.025em;
  color: var(--wall-text);
  margin-bottom: 1.25rem;
}
.stub p {
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.75;
  color: rgba(237,233,228,0.6);
  max-width: 540px;
  margin: 0 auto 2rem;
}
.stub-back {
  font-size: 0.9375rem;
  color: var(--wall-text);
  opacity: 0.65;
  transition: opacity 0.2s;
}
.stub-back:hover { opacity: 1; text-decoration: underline; }
.footer { border-top: 1px solid var(--border); padding-block: 1.5rem; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; }
.footer-logo { font-family: var(--font-display); font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.02em; }
.footer-meta { font-size: 0.8125rem; color: var(--ink-faint); font-style: italic; }
@media (max-width: 768px) {
  .nav-links { display: none; }
  .nav-links.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: var(--nav-h);
    left: 0; right: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem var(--pad);
    gap: 1.25rem;
    z-index: 99;
  }
  .btn-nav { display: none; }
  .nav-toggle { display: flex; }
  .footer-inner { flex-direction: column; gap: 0.375rem; align-items: flex-start; }
}
@media (max-width: 480px) {
  :root { --pad: 1.25rem; }
}
  </style>
</head>
<body>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Orchen</a>
      <div class="nav-links" id="nav-links">
        <a href="/#problem">The Problem</a>
        <a href="/#how">How It Works</a>
        <a href="/#contact">For Schools</a>
      </div>
      <a href="/#contact" class="btn-nav">Book a walkthrough</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="stub">
      <div class="container">
        <div class="stub-inner">
          <span class="stub-eyebrow">TRUST &amp; COMPLIANCE</span>
          <h1>Coming soon</h1>
          <p>Our full data, privacy, and compliance documentation is being prepared for publication.</p>
          <a href="/" class="stub-back">&larr; Back to Orchen</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-logo">Orchen</span>
      <span class="footer-meta">&copy; 2026 Orchen AI &middot; <a href="/privacy" style="border-bottom:1px solid currentColor;">Privacy Policy</a> &middot; <a href="/terms" style="border-bottom:1px solid currentColor;">Terms of Service</a></span>
    </div>
  </footer>

  <script>
  (function () {
    var nav    = document.getElementById('nav');
    var toggle = document.getElementById('nav-toggle');
    var links  = document.getElementById('nav-links');
    window.addEventListener('scroll', function () {
      nav.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      links.classList.toggle('open', !open);
    });
  }());
  </script>

</body>
</html>
