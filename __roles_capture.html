<!doctype html>
<meta charset="utf-8">
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f7f2ea;
  }

  iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
  }
</style>
<iframe id="page" src="/"></iframe>
<script>
  const frame = document.getElementById('page');
  const role = new URLSearchParams(location.search).get('role') || 'students';
  const chip = new URLSearchParams(location.search).get('chip');

  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    doc.querySelectorAll('.animate-in').forEach((el) => el.classList.add('visible'));
    doc.querySelector(`#tab-${role}`)?.click();
    if (chip) doc.querySelector(`#panel-${role} .roles-chip[data-chip="${chip}"]`)?.click();
    doc.querySelector('#how')?.scrollIntoView({ block: 'center' });
  });
</script>
